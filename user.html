<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="api-base" content="/api" />
  <title>验证码接收</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #fff;
      --text: #172033;
      --muted: #667085;
      --line: #d9e1ec;
      --blue: #1769ff;
      --blue2: #0d4fc5;
      --green: #12815d;
      --amber: #a15c07;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    button { height: 42px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; padding: 0 16px; font-size: 14px; cursor: pointer; }
    button:hover { background: var(--blue2); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    input { height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 13px; font: inherit; width: 100%; }
    p { color: var(--muted); line-height: 1.7; margin: 0; }
    .user-page { display: grid; place-items: center; padding: 24px; }
    .user-shell { width: min(860px, 100%); display: grid; grid-template-columns: .9fr 1.1fr; gap: 18px; align-items: stretch; }
    .hero { background: #121826; color: #fff; border-radius: 8px; padding: 34px; display: flex; flex-direction: column; justify-content: center; min-height: 430px; }
    .hero .brand { color: #9ec2ff; font-weight: 800; margin-bottom: 20px; }
    .hero h1 { margin: 0 0 14px; font-size: 34px; letter-spacing: 0; line-height: 1.18; }
    .hero p { color: #d5deec; }
    .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 16px 34px rgba(17,24,39,.08); padding: 24px; }
    .key-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-bottom: 18px; }
    .result { border: 1px solid var(--line); background: #f8fbff; border-radius: 8px; padding: 18px; margin-bottom: 14px; }
    .result span, .code-panel span { display: block; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    .result strong { display: block; font-size: 31px; letter-spacing: 0; margin-bottom: 8px; }
    .result small { display: inline-flex; min-width: 70px; height: 26px; align-items: center; justify-content: center; background: #fff7ed; color: var(--amber); border-radius: 999px; font-weight: 800; }
    .code-panel { min-height: 142px; border: 1px dashed #b8c6d8; border-radius: 8px; padding: 20px; display: grid; align-content: center; text-align: center; margin-bottom: 14px; background: #fbfdff; }
    .code-panel strong { display: block; font-size: 42px; letter-spacing: 0; margin-bottom: 8px; }
    .buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .buttons button:nth-child(3) { background: #475467; }
    .buttons button:nth-child(4) { background: var(--green); }
    @media (max-width: 820px) {
      .user-shell { grid-template-columns: 1fr; }
      .hero { min-height: auto; }
      .key-row { grid-template-columns: 1fr; width: 100%; }
    }
  </style>
</head>
<body class="user-page">
  <main class="user-shell">
    <section class="hero">
      <div class="brand">SMS Verify</div>
      <h1>输入密钥，获取可用手机号</h1>
      <p>全部号码均为虚构数据，验证码为模拟结果。输入 DEMO-KEY-001 至 DEMO-KEY-006 即可体验完整流程。</p>
    </section>

    <section class="box">
      <div class="key-row">
        <input id="keyInput" placeholder="演示密钥 DEMO-KEY-001" autocomplete="off" />
        <button id="claimBtn" type="button">获取手机号</button>
      </div>

      <div class="result">
        <span id="stateText">等待输入密钥</span>
        <strong id="phoneText">未分配</strong>
        <small id="timerText">10:00</small>
      </div>

      <div class="code-panel">
        <span>验证码</span>
        <strong id="codeText">----</strong>
        <p id="msgText">这是功能演示，领取虚构号码后将自动显示模拟验证码。</p>
      </div>

      <div class="buttons">
        <button id="copyBtn" type="button" disabled>复制手机号</button>
        <button id="refreshBtn" type="button" disabled>刷新验证码</button>
        <button id="changeBtn" type="button" disabled>换一个手机号</button>
        <button id="finishBtn" type="button" disabled>完成</button>
      </div>
    </section>
  </main>

  <script src="user.js"></script>
</body>
</html>
