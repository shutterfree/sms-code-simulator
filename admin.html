<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="api-base" content="/api" />
  <title>后台管理</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #fff;
      --text: #172033;
      --muted: #667085;
      --line: #d9e1ec;
      --blue: #1769ff;
      --blue2: #0d4fc5;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); }
    button { height: 42px; border: 0; border-radius: 8px; background: var(--blue); color: #fff; padding: 0 16px; font-size: 14px; cursor: pointer; }
    button:hover { background: var(--blue2); }
    input { height: 42px; border: 1px solid var(--line); border-radius: 8px; padding: 0 13px; font: inherit; width: 100%; }
    p { color: var(--muted); line-height: 1.7; margin: 0; }
    .admin-shell { padding: 26px; }
    .admin-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 18px; }
    .admin-top h1 { margin: 0 0 5px; font-size: 25px; }
    .login { display: grid; grid-template-columns: 210px auto; gap: 10px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
    .stats div, .table-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 16px 34px rgba(17,24,39,.08); }
    .stats div { padding: 16px; }
    .stats strong { display: block; font-size: 28px; margin-bottom: 4px; }
    .stats span { color: var(--muted); font-size: 13px; }
    .admin-grid { display: grid; grid-template-columns: 1.25fr .75fr; gap: 16px; align-items: start; }
    .table-card { overflow: hidden; }
    .table-card h2 { margin: 0; padding: 16px; font-size: 18px; border-bottom: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--line); text-align: left; font-size: 13px; word-break: break-all; }
    th { color: var(--muted); background: #f8fafc; }
    .add-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 16px 34px rgba(17,24,39,.08); padding: 16px; margin-bottom: 16px; }
    .add-card h2 { margin: 0 0 6px; font-size: 18px; }
    .add-card p { font-size: 13px; margin: 0 0 10px; }
    .add-card textarea { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 8px; padding: 10px 13px; font: inherit; resize: vertical; margin-bottom: 10px; }
    .add-card .ok { color: #12924a; margin-left: 10px; font-size: 13px; }
    .add-card .err { color: #d4343b; margin-left: 10px; font-size: 13px; }
    .modal-mask { position: fixed; inset: 0; background: rgba(17,24,39,.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .modal-box { background: #fff; border-radius: 10px; padding: 20px; width: min(560px, 92vw); box-shadow: 0 24px 50px rgba(0,0,0,.3); }
    .modal-box h2 { margin: 0 0 12px; font-size: 18px; }
    .modal-box textarea { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; resize: vertical; }
    .modal-actions { margin-top: 12px; display: flex; gap: 10px; }
    @media (max-width: 820px) {
      .admin-grid, .stats { grid-template-columns: 1fr; }
      .admin-top { flex-direction: column; }
      .login { grid-template-columns: 1fr; width: 100%; }

      /* 表格转卡片：每行一张卡，字段名在左、值在右 */
      .table-card table, .table-card thead, .table-card tbody, .table-card tr, .table-card td { display: block; }
      .table-card thead { display: none; }
      .table-card tr { border-bottom: 1px solid var(--line); padding: 6px 12px; }
      .table-card tr:last-child { border-bottom: 0; }
      .table-card td { display: flex; justify-content: space-between; align-items: center; gap: 12px; border-bottom: 0; padding: 7px 0; text-align: right; word-break: break-all; }
      .table-card td::before { content: attr(data-label); color: var(--muted); font-size: 12px; flex-shrink: 0; }
      .table-card td button { height: 34px; font-size: 13px; }
    }
  </style>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-top">
      <div>
        <h1>后台管理</h1>
        <p>查看密钥使用情况、号码状态和问题号码。</p>
      </div>
      <div class="login">
        <input id="adminToken" placeholder="演示口令 demo-admin" type="password" />
        <button id="loadBtn" type="button">进入后台</button>
      </div>
    </header>

    <section class="stats">
      <div><strong id="readyKeys">-</strong><span>未使用密钥</span></div>
      <div><strong id="lockedKeys">-</strong><span>使用中密钥</span></div>
      <div><strong id="usedKeys">-</strong><span>已失效密钥</span></div>
      <div><strong id="problemNumbers">-</strong><span>问题号码</span></div>
    </section>

    <section class="add-card">
      <h2>补充号码</h2>
      <p>每行一个，格式：号码----接口。本地模拟模式使用示例数据，不会查询外部接口。</p>
      <textarea id="addNumbersText" rows="5" placeholder="+000000000007----https://example.invalid/sms/demo"></textarea>
      <div>
        <button id="addNumbersBtn" type="button">补充号码</button>
        <span id="addNumbersMsg"></span>
      </div>
    </section>

    <section class="add-card">
      <h2>补充密钥</h2>
      <p>生成新的用户密钥，追加到密钥池。密钥用完以后可以这样补充。</p>
      <div>
        <input id="addKeysCount" type="number" min="1" max="200" value="10" style="width:110px;display:inline-block;margin-right:10px;" />
        <button id="addKeysBtn" type="button">生成密钥</button>
      </div>
      <p id="addKeysMsg" style="margin-top:8px;font-size:13px;"></p>
      <textarea id="newKeysOut" rows="4" readonly placeholder="生成的密钥会显示在这里，方便复制。"></textarea>
    </section>

    <section class="admin-grid">
      <div class="table-card">
        <h2>密钥使用情况</h2>
        <table>
          <thead><tr><th>密钥</th><th>状态</th><th>绑定号码</th><th>完成时间</th></tr></thead>
          <tbody id="keyRows"></tbody>
        </table>
      </div>
      <div class="table-card">
        <h2>问题号码</h2>
        <table>
          <thead><tr><th>手机号</th><th>原因</th><th>时间</th><th>操作</th></tr></thead>
          <tbody id="problemRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="keyModal" class="modal-mask" style="display:none;">
    <div class="modal-box">
      <h2>新生成的密钥</h2>
      <textarea id="modalKeysOut" rows="10" readonly></textarea>
      <div class="modal-actions">
        <button id="copyKeysBtn" type="button">复制全部</button>
        <button id="closeKeysModal" type="button" style="background:#8a94a6;">关闭</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
